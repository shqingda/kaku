<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f2" />
    <script>
      (() => {
        const stored = localStorage.getItem('kaku-theme');
        const mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
        const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="icon" href="/kaku-icon.png" />
    <link rel="apple-touch-icon" href="/kaku-icon.png" />
    <meta
      name="description"
      content="Kaku 是一款为 iOS 与 Android 设计的 Bangumi 第三方客户端，轻松管理收藏、进度、评分与讨论。"
    />
    <meta property="og:title" content="Kaku · 你的动画与兴趣收藏盒" />
    <meta
      property="og:description"
      content="一个安静、快速、尊重原作数据的 Bangumi 第三方客户端。"
    />

    <link rel="canonical" href="https://kaku-web.shqingda.workers.dev/" />
    <title>Kaku · 你的动画与兴趣收藏盒</title>
