overrides:
  # Security fixes for pinned tooling dependencies; keep the native SDK unchanged.
  'sharp@>=0.35.0 <0.35.5': 0.35.5
  '@expo/cli@58.1.15>zod': 4.6.7
  '@types/react-dom': 19.3.0
  # GHSA-67mh-4wv8-2f99: drizzle-kit declares but never loads @esbuild-kit/esm-loader;
  # reuse the esbuild drizzle-kit already ships instead of the vulnerable 0.18 copy.
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  # October 2026 Node.js security release. Keep each undici major on its patched release.
  "undici@>=6.0.0 <6.29.1": 6.29.1
  "undici@>=7.0.0 <7.30.1": 7.30.1
  "undici@>=8.0.0 <8.12.2": 8.12.2

