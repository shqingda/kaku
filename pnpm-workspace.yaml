packages:
  - apps/*
  - packages/*

overrides:
  # Security fixes for pinned tooling dependencies; keep the native SDK unchanged.
  'sharp@>=0.35.0 <0.35.5': 0.35.5
  '@types/react-dom': 19.3.0
  # GHSA-67mh-4wv8-2f99: drizzle-kit declares but never loads @esbuild-kit/esm-loader;
  # reuse the esbuild drizzle-kit already ships instead of the vulnerable 0.18 copy.
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  # October 2026 Node.js security release. Keep each undici major on its patched release.
  "undici@>=6.0.0 <6.29.1": 6.29.1
  "undici@>=7.0.0 <7.30.1": 7.30.1

minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  # Previously approved Expo patches still younger than 24 hours on 2026-11-01.
  - '@expo/cli@58.1.18'
  - '@expo/local-build-cache-provider@58.0.10'
  - '@expo/log-box@58.0.14'
  - '@expo/metro-config@58.0.20'
  - '@expo/metro-runtime@58.0.16'
  - '@expo/prebuild-config@58.0.18'
  - '@expo/router-server@58.0.20'
  - 'babel-preset-expo@58.0.23'
  - 'expo@58.0.22'
  - 'expo-build-properties@58.0.12'
  - 'expo-dev-client@58.0.18'
  - 'expo-dev-launcher@58.0.18'
  - 'expo-modules-core@58.0.29'
  - 'expo-router@58.0.29'
  - 'expo-sqlite@58.0.15'

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  dtrace-provider: false
  esbuild: true
  unrs-resolver: true
  workerd: true
