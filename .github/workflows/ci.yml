name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Expo dependency compatibility
        run: pnpm --filter @kaku/mobile exec expo install --check

      - name: Run Expo project diagnostics
        working-directory: apps/mobile
        run: pnpm dlx expo-doctor

      - name: Type-check workspace
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Check API test coverage
        run: pnpm --filter @kaku/api test:coverage

      - name: Check mobile test coverage
        run: pnpm --filter @kaku/mobile test:coverage

      - name: Run mobile component tests
        run: pnpm --filter @kaku/mobile test:ui

      - name: Bundle iOS app
        run: pnpm --filter @kaku/mobile exec expo export --platform ios --output-dir /tmp/kaku-ios

      - name: Bundle Android app
        run: pnpm --filter @kaku/mobile exec expo export --platform android --output-dir /tmp/kaku-android

      - name: Build website
        run: pnpm build:web

  scrape-regression:
    name: HTML scrape regression
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run HTML parser regression tests
        run: pnpm --filter @kaku/api test:html-parsers
