name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Expo dependency compatibility
        run: pnpm --filter @kaku/mobile exec expo install --check

      - name: Run Expo project diagnostics
        working-directory: apps/mobile
        run: pnpm dlx expo-doctor

      - name: Type-check workspace
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Bundle iOS app
        run: pnpm --filter @kaku/mobile exec expo export --platform ios --output-dir /tmp/kaku-ios

      - name: Bundle Android app
        run: pnpm --filter @kaku/mobile exec expo export --platform android --output-dir /tmp/kaku-android

      - name: Build website
        run: pnpm build:web
