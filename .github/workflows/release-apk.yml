name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'EAS build profile (preview = 独立安装包)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      reuse_existing:
        description: '复用 EAS 最近一次成功的构建（跳过云端构建，快速验证发布链路）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Find existing build
        id: find
        if: github.event.inputs.reuse_existing == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm exec eas build:list --platform android --limit 5 --json 2>/dev/null > /tmp/eas-list.json
          APK_URL=$(node -e "
            const builds = require('/tmp/eas-list.json');
            const hit = builds.find(b => b.status === 'finished' && b.artifacts?.buildUrl);
            if (!hit) { console.error('No finished build with artifact URL found'); process.exit(1); }
            console.log('Reusing build ' + hit.id);
            console.log(hit.artifacts.buildUrl);
          " | tail -1)
          if [ -z "$APK_URL" ]; then
            echo "::error::No finished build found to reuse"
            exit 1
          fi
          echo "apk-url=$APK_URL" >> "$GITHUB_OUTPUT"

      - name: Start EAS build
        if: github.event.inputs.reuse_existing != 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm exec eas build \
            --profile "${{ github.event.inputs.channel }}" \
            --platform android \
            --non-interactive \
            --json > /tmp/eas-build.json
          cat /tmp/eas-build.json

      - name: Wait for build and collect artifact URL
        id: build
        if: github.event.inputs.reuse_existing != 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID=$(node -e "const b=require('/tmp/eas-build.json');process.stdout.write(b[0].id)")
          echo "build-id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 60); do
            STATUS=$(pnpm exec eas build:view "$BUILD_ID" --json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const b=JSON.parse(d);process.stdout.write((b.status||'')+'|'+(b.artifacts?.buildUrl||''))})")
            STATE=$(echo "$STATUS" | cut -d'|' -f1)
            URL=$(echo "$STATUS" | cut -d'|' -f2)
            LOWERCASE_STATE=$(echo "$STATE" | tr '[:upper:]' '[:lower:]')
            echo "poll $i: $STATE"
            if [ "$LOWERCASE_STATE" = "finished" ]; then
              if [ -z "$URL" ]; then
                echo "::error::Build finished but no artifact URL was provided"
                exit 1
              fi
              echo "apk-url=$URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$LOWERCASE_STATE" = "errored" ] || [ "$LOWERCASE_STATE" = "cancelled" ]; then
              echo "::error::EAS build ended with state $STATE"
              exit 1
            fi
            sleep 60
          done
          echo "::error::Timed out waiting for EAS build"
          exit 1

      - name: Download APK
        run: |
          APK_URL="${{ steps.build.outputs.apk-url || steps.find.outputs.apk-url }}"
          echo "Downloading from: $APK_URL"
          curl -sL -o kaku.apk "$APK_URL"
          ls -la kaku.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.event.inputs.channel }}-${{ github.run_number }}
          name: Kaku Android (${{ github.event.inputs.channel }})
          files: kaku.apk
          draft: false
