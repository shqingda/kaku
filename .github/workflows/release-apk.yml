name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'EAS build profile (preview = 独立安装包)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start EAS build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm exec eas build \
            --profile "${{ github.event.inputs.channel }}" \
            --platform android \
            --non-interactive \
            --json > /tmp/eas-build.json
          cat /tmp/eas-build.json

      - name: Wait for build and collect artifact URL
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID=$(node -e "const b=require('/tmp/eas-build.json');process.stdout.write(b[0].id)")
          echo "build-id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 60); do
            STATUS=$(pnpm exec eas build:view "$BUILD_ID" --json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const b=JSON.parse(d);process.stdout.write(b.status+'|'+(b.artifacts?.buildUrl||''))})")
            STATE=$(echo "$STATUS" | cut -d'|' -f1)
            URL=$(echo "$STATUS" | cut -d'|' -f2)
            echo "poll $i: $STATE"
            if [ "$STATE" = "finished" ]; then
              echo "apk-url=$URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$STATE" = "errored" ] || [ "$STATE" = "cancelled" ]; then
              echo "::error::EAS build ended with state $STATE"
              exit 1
            fi
            sleep 60
          done
          echo "::error::Timed out waiting for EAS build"
          exit 1
        id: build

      - name: Download APK
        run: |
          curl -sL -o kaku.apk "${{ steps.build.outputs.apk-url }}"
          ls -la kaku.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.event.inputs.channel }}-${{ github.run_number }}
          name: Kaku Android (${{ github.event.inputs.channel }})
          files: kaku.apk
          generate_release_notes: true
          draft: false
