name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'GitHub APK profile (Play 使用独立的 production AAB)'
        required: true
        default: 'github'
        type: choice
        options:
          - github
      tag:
        description: 'Release tag（留空使用 v<app version>）'
        required: false
        default: ''

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          VERSION=$(node -p "require('./apps/mobile/app.config.js').expo.version")
          TAG=${RELEASE_TAG:-v$VERSION}
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag must match v$VERSION"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Start EAS build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm dlx eas-cli@22.2.0 build \
            --profile "${{ github.event.inputs.channel }}" \
            --platform android \
            --non-interactive \
            --no-wait \
            --json > /tmp/eas-build.json
          cat /tmp/eas-build.json

      - name: Wait for build and collect artifact URL
        id: build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID=$(node -e "const b=require('/tmp/eas-build.json');process.stdout.write(b[0].id)")
          for i in $(seq 1 60); do
            STATUS=$(pnpm dlx eas-cli@22.2.0 build:view "$BUILD_ID" --json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const b=JSON.parse(d);process.stdout.write((b.status||'')+'|'+(b.artifacts?.buildUrl||''))})")
            STATE=$(echo "$STATUS" | cut -d'|' -f1)
            URL=$(echo "$STATUS" | cut -d'|' -f2)
            LOWERCASE_STATE=$(echo "$STATE" | tr '[:upper:]' '[:lower:]')
            echo "poll $i: $STATE"
            if [ "$LOWERCASE_STATE" = "finished" ]; then
              if [ -z "$URL" ]; then
                echo "::error::Build finished but no artifact URL was provided"
                exit 1
              fi
              echo "apk-url=$URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$LOWERCASE_STATE" = "errored" ] || [ "$LOWERCASE_STATE" = "cancelled" ]; then
              echo "::error::EAS build ended with state $STATE"
              exit 1
            fi
            sleep 60
          done
          echo "::error::Timed out waiting for EAS build"
          exit 1

      - name: Download APK
        id: artifact
        run: |
          NAME=kaku-release.apk
          curl --fail --show-error --location -o "$NAME" "${{ steps.build.outputs.apk-url }}"
          python3 - "$NAME" <<'PYAPK'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = set(archive.namelist())
              if not {'AndroidManifest.xml', 'classes.dex'} <= names or 'BundleConfig.pb' in names:
                  raise SystemExit('Expected an installable APK, not an AAB or download error')
          PYAPK
          python3 scripts/report-apk-size.py "$NAME"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Kaku Android v${{ steps.version.outputs.version }}
          body_path: scripts/release-notes.md
          files: ${{ steps.artifact.outputs.apk }}
          draft: false
