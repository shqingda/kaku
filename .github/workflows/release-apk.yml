name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（留空自动生成 android-<run_number>）'
        required: false
        default: ''

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pin ABI in app config
        run: |
          node -e "
            const fs = require('fs');
            const p = 'apps/mobile/app.config.js';
            let s = fs.readFileSync(p, 'utf8');
            const before = s.includes('abiFilters: [\"${{ matrix.abi }}\"]');
            if (!before) {
              s = s.replace(/abiFilters: EAS_ABI \? \[EAS_ABI\] : undefined/, 'abiFilters: [\"${{ matrix.abi }}\"]');
              fs.writeFileSync(p, s);
            }
          "

      - name: Start EAS build (${{ matrix.abi }})
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm exec eas build \
            --profile "preview-split-${{ matrix.abi }}" \
            --platform android \
            --non-interactive \
            --json > /tmp/eas-build.json
          cat /tmp/eas-build.json

      - name: Wait for build and collect artifact URL
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID=$(node -e "const b=require('/tmp/eas-build.json');process.stdout.write(b[0].id)")
          for i in $(seq 1 60); do
            STATUS=$(pnpm exec eas build:view "$BUILD_ID" --json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const b=JSON.parse(d);process.stdout.write((b.status||'')+'|'+(b.artifacts?.buildUrl||''))})")
            STATE=$(echo "$STATUS" | cut -d'|' -f1)
            URL=$(echo "$STATUS" | cut -d'|' -f2)
            LOWERCASE_STATE=$(echo "$STATE" | tr '[:upper:]' '[:lower:]')
            echo "poll $i: $STATE"
            if [ "$LOWERCASE_STATE" = "finished" ]; then
              if [ -z "$URL" ]; then
                echo "::error::Build finished but no artifact URL was provided"
                exit 1
              fi
              echo "apk-url=$URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$LOWERCASE_STATE" = "errored" ] || [ "$LOWERCASE_STATE" = "cancelled" ]; then
              echo "::error::EAS build ended with state $STATE"
              exit 1
            fi
            sleep 60
          done
          echo "::error::Timed out waiting for EAS build"
          exit 1
        id: build

      - name: Download APK
        run: |
          curl -sL -o "kaku-${{ matrix.abi }}.apk" "${{ steps.build.outputs.apk-url }}"
          ls -la "kaku-${{ matrix.abi }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaku-${{ matrix.abi }}
          path: kaku-${{ matrix.abi }}.apk
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: List downloaded APKs
        run: ls -la apks

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || format('android-{0}', github.run_number) }}
          name: Kaku Android (1.0.0+${{ github.run_number }})
          files: apks/kaku-*.apk
          draft: false
