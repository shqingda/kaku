appId: placeholder
name: Open friend timeline when signed in
tags:
  - smoke
---
# 覆盖：首页好友动态 → 查看全部动态 → 好友动态页。
# 未登录时首页不渲染该分区，流程在此直接通过（no-op gate）。
- runFlow:
    file: reset-home.yaml
- runFlow:
    when:
      visible: "打开账户菜单"
    commands:
      - scrollUntilVisible:
          element: "查看全部好友动态"
          direction: DOWN
          centerElement: true
          timeout: 30000
      - tapOn: "查看全部好友动态"
      - extendedWaitUntil:
          visible: "好友动态"
          timeout: 15000
      - assertVisible: "好友动态"
