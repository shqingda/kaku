appId: com.shqingda.kaku
name: Guest personal data requires sign-in
tags:
  - smoke
---
# 覆盖：未登录 → 账户 → 我的数据 → 明确登录提示（不写远端）
- launchApp
- tapOn: "登录 Bangumi"
- extendedWaitUntil:
    visible: "账户"
    timeout: 10000
- tapOn: "我的数据"
- extendedWaitUntil:
    visible: "登录后查看收藏数据"
    timeout: 10000
- assertVisible: "登录后查看收藏数据"
