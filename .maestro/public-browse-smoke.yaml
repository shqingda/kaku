appId: placeholder
name: Public browse smoke test
tags:
  - smoke
---
- runFlow:
    file: reset-home.yaml
- assertVisible: Kaku
- runFlow:
    file: enter-subject-search.yaml
- extendedWaitUntil:
    # 等待结果区域的条目，不能把输入框中的同名查询当作结果。
    visible:
      text: "葬送的芙莉莲.*"
      below: "搜索结果"
      index: 0
    timeout: 30000
- tapOn:
    text: "葬送的芙莉莲.*"
    below: "搜索结果"
    index: 0
- extendedWaitUntil:
    visible: 打开收藏盒
    timeout: 15000
- tapOn: 返回
- assertVisible: 搜索结果
