appId: placeholder
name: Open daily calendar from explore
tags:
  - smoke
---
# 覆盖：首页发现入口 → 综合页 → 每日放送分区可见
- runFlow:
    file: reset-home.yaml
- scrollUntilVisible:
    centerElement: true
    direction: DOWN
    element:
      text: "综合"
- waitForAnimationToEnd
- tapOn: "综合"
- extendedWaitUntil:
    visible: "频道"
    timeout: 15000
- scrollUntilVisible:
    direction: DOWN
    element:
      text: "查看全部每日放送"
- assertVisible: "每日放送"
