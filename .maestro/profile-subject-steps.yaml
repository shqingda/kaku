appId: placeholder
name: Profile subject opening and list scroll
tags:
  - profile
---
- tapOn: "搜索条目"
- inputText: "葬送的芙莉莲"
- pressKey: Enter
- extendedWaitUntil:
    visible: "葬送的芙莉莲.*"
    timeout: 15000
- tapOn:
    text: "葬送的芙莉莲.*"
    index: 1
- extendedWaitUntil:
    visible: "打开收藏盒"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "查看角色与声优"
    direction: DOWN
- tapOn: "查看角色与声优"
- extendedWaitUntil:
    visible: "角色与声优"
    timeout: 15000
- tapOn: "返回"
- assertVisible: "打开收藏盒"
