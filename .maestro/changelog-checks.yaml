# 前置：刚打开更新日志页。最新版用稳定 ID，1.1.24 是必须保留的历史起点。
# 同时检查可访问的展开语义与正文可见性；结束后返回上一页。
appId: placeholder
---
- assertVisible: "更新日志"
- assertVisible:
    id: changelog-latest-toggle
    text: "版本 .*，收起更新内容"
- assertVisible:
    id: changelog-latest-first-note
- tapOn:
    id: changelog-latest-toggle
- assertVisible:
    id: changelog-latest-toggle
    text: "版本 .*，展开更新内容"
- assertNotVisible:
    id: changelog-latest-first-note
- tapOn:
    id: changelog-latest-toggle
- assertVisible:
    id: changelog-latest-first-note
- takeScreenshot: changelog-expanded
- scrollUntilVisible:
    direction: DOWN
    element:
      id: 'changelog-version-1\.1\.24-toggle'
- assertVisible:
    id: 'changelog-version-1\.1\.24-toggle'
    text: "版本 .*，展开更新内容"
- tapOn:
    id: 'changelog-version-1\.1\.24-toggle'
- scrollUntilVisible:
    direction: DOWN
    element:
      id: 'changelog-version-1\.1\.24-first-note'
- assertVisible:
    id: 'changelog-version-1\.1\.24-first-note'
- takeScreenshot: changelog-history
- tapOn: "返回"
