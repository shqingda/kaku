appId: com.shqingda.kaku
name: Open subject character section
tags:
  - smoke
---
# 覆盖：搜索 → 条目详情 → 角色与声优分区 → 返回详情
# （分区入口带 press-in 预取，这里同时覆盖预取路径的可用性）
- launchApp
- tapOn: "搜索条目"
- inputText: "葬送的芙莉莲"
- pressKey: Enter
- extendedWaitUntil:
    visible: "葬送的芙莉莲.*"
    timeout: 15000
- tapOn:
    text: "葬送的芙莉莲.*"
    index: 1
- extendedWaitUntil:
    visible: "打开收藏盒"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "角色与声优"
    direction: DOWN
- tapOn: "角色与声优"
- extendedWaitUntil:
    visible: "角色与声优"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: subject-characters
- tapOn: "返回"
- assertVisible: "打开收藏盒"
