appId: placeholder
name: Open subject character section
tags:
  - smoke
---
# 覆盖：搜索 → 条目详情 → 角色与声优分区 → 角色详情 → 返回详情
# （分区入口带 press-in 预取，这里同时覆盖预取路径的可用性）
- runFlow:
    file: reset-home.yaml
- runFlow:
    file: enter-subject-search.yaml
- extendedWaitUntil:
    visible: "葬送的芙莉莲.*"
    timeout: 15000
- tapOn:
    text: "葬送的芙莉莲.*"
    below: "搜索结果"
    index: 0
- extendedWaitUntil:
    visible: "打开收藏盒"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "查看角色与声优"
    direction: DOWN
- tapOn: "查看角色与声优"
- extendedWaitUntil:
    visible: "角色与声优"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: subject-characters
- tapOn:
    text: "打开角色：.*"
    index: 0
- extendedWaitUntil:
    visible: "全屏查看.*图片"
    timeout: 15000
- tapOn: "返回"
- assertVisible: "角色与声优"
- tapOn: "返回"
# 返回时保留条目滚动位置；大字体下收藏入口可能在屏幕上方。
- scrollUntilVisible:
    element: "打开收藏盒"
    direction: UP
- assertVisible: "打开收藏盒"
