---
# 覆盖：频道 → 分类浏览
- runFlow:
    file: reset-home.yaml
- scrollUntilVisible:
    centerElement: true
    direction: DOWN
    element:
      text: "频道"
- waitForAnimationToEnd
- tapOn: "频道"
- extendedWaitUntil:
    visible: "分类浏览"
    timeout: 15000
- tapOn: "分类浏览"
- extendedWaitUntil:
    visible: "分类浏览"
    timeout: 15000
- assertVisible: "动画 · 排名"
