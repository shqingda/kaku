appId: placeholder
name: Inspect the current appearance without changing preferences
---
# 只检查当前选项并截图，不切换主题。
# 供商店截图和独立切换专项复用；切换与恢复由 settings-theme-toggle.yaml 负责。
- runFlow:
    file: reset-home.yaml
- runFlow:
    file: open-account.yaml
- scrollUntilVisible:
    direction: DOWN
    element: "外观与同步"
- tapOn: "外观与同步"
- extendedWaitUntil:
    visible: "外观"
    timeout: 10000
- assertVisible: "跟随系统"
- assertVisible: "浅色"
- assertVisible: "深色"
- assertVisible:
    text: "跟随系统|浅色|深色"
    selected: true
- waitForAnimationToEnd
- takeScreenshot: settings-current-appearance
