appId: com.shqingda.kaku.debug
name: Changelog v1.1.14 expands and reopens
---
- runFlow:
    file: reset-home.yaml
- runFlow:
    file: open-account.yaml
- scrollUntilVisible:
    direction: DOWN
    element:
      text: "更新日志"
- tapOn: "更新日志"
- assertVisible: "更新日志"
- tapOn: "版本 .*，收起更新内容"
- scrollUntilVisible:
    direction: DOWN
    element:
      text: "版本 1.1.14，展开更新内容"
- tapOn: "版本 1.1.14，展开更新内容"
- assertVisible: "Android 安装包启用 R8 代码压缩与资源裁剪，进一步减小下载体积。"
- takeScreenshot: changelog-1.1.14-expanded
- tapOn: "版本 1.1.14，收起更新内容"
- tapOn: "版本 1.1.14，展开更新内容"
- assertVisible: "Android 安装包启用 R8 代码压缩与资源裁剪，进一步减小下载体积。"
- takeScreenshot: changelog-1.1.14-reopened
